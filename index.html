<script>
(() => {
"use strict";

// Render সার্ভারের সঠিক ব্যাকএন্ড রুট
const API_ENDPOINT = "https://my-personal-ai-ubh0.onrender.com/api/chat";
const HEALTH_ENDPOINT = "https://my-personal-ai-ubh0.onrender.com/health";

const terminal = document.getElementById("terminal");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const micPill = document.getElementById("micPill");
const micHelp = document.getElementById("micHelp");
const viz = document.getElementById("viz");

let busy = false;
let conversationId = null;
let recognition = null;
let micOn = false;
let requestStart = 0;
let soundEnabled = true;
let utterancePlaying = false;
let manualStop = false;
let pendingStart = false;

// টার্মিনালে মেসেজ আউটপুট দেওয়ার ফাংশন
function log(who, text, type = "agent") {
  const row = document.createElement("div");
  row.className = `msg ${type}`;
  
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = new Date().toLocaleTimeString();
  
  const label = document.createElement("span");
  label.className = "who";
  label.textContent = `[${who}]`;
  
  const content = document.createElement("span");
  content.textContent = String(text ?? "");
  
  row.append(time, label, content);
  terminal.appendChild(row);
  terminal.scrollTop = terminal.scrollHeight;
  return row;
}

function setState(text, color) {
  const el = document.getElementById("sys-status");
  if (el) {
    el.textContent = text;
    el.style.color = color;
  }
}

function micUI(on) {
  micBtn.textContent = on ? "MIC ON" : "MIC OFF";
  micBtn.classList.toggle("active", on);
  micPill.textContent = on ? "MIC ON" : "MIC OFF";
}

function stopListening() {
  if (recognition) {
    try { recognition.stop(); } catch (_) {}
  }
}

function stopSpeech() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
  utterancePlaying = false;
  viz.classList.remove("playing");
}

function speak(text) {
  if (!soundEnabled || !("speechSynthesis" in window)) {
    if (micOn && !busy) beginListening();
    return;
  }
  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  
  utterance.onstart = () => {
    utterancePlaying = true;
    viz.classList.add("playing");
  };
  
  const finished = () => {
    utterancePlaying = false;
    viz.classList.remove("playing");
    if (micOn && !busy) window.setTimeout(beginListening, 400);
  };
  
  utterance.onend = finished;
  utterance.onerror = finished;
  window.speechSynthesis.speak(utterance);
}

// AI এর সাথে ব্যাকএন্ড API কানেকশন ফাংশন
async function sendMessage(text) {
  text = String(text ?? "").trim();
  if (!text || busy) return;
  
  busy = true;
  sendBtn.disabled = true;
  input.disabled = true;
  micBtn.disabled = true;
  stopListening();
  stopSpeech();
  
  requestStart = performance.now();
  log("YOU", text, "system");
  input.value = "";
  
  const replyRow = log("AI", "Connecting to AI…", "agent");
  const replyContent = replyRow.lastElementChild;
  
  const aborter = new AbortController();
  const timer = setTimeout(() => aborter.abort(), 70000);
  
  try {
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, ...(conversationId ? { conversationId } : {}) }),
      signal: aborter.signal
    });
    
    const data = await response.json().catch(() => null);
    if (!response.ok) throw new Error(data?.error || data?.message || `HTTP ${response.status}`);
    
    const answer = data?.reply ?? data?.response;
    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error("The server did not return an AI reply.");
    }
    
    if (typeof data.conversationId === "string") conversationId = data.conversationId;
    
    replyContent.textContent = answer;
    document.getElementById("lat").textContent = Math.round(performance.now() - requestStart) + "ms";
    setState("AI CONNECTED", "var(--lime)");
    speak(answer);
  } catch (err) {
    const message = err.name === "AbortError" 
      ? "Request timed out. Server taking too long." 
      : err.message;
    replyContent.textContent = `Request failed: ${message}`;
    log("ERROR", message, "error");
    setState("REQUEST FAILED", "var(--red)");
  } finally {
    clearTimeout(timer);
    busy = false;
    sendBtn.disabled = false;
    input.disabled = false;
    micBtn.disabled = false;
    input.focus();
    if (micOn && !utterancePlaying) window.setTimeout(beginListening, 600);
  }
}

// ইভেন্ট লিসেনারসমূহ
sendBtn.addEventListener("click", () => sendMessage(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage(input.value);
  }
});

document.getElementById("clear").addEventListener("click", () => {
  terminal.replaceChildren();
  log("SYSTEM", "Log cleared.", "system");
});

document.getElementById("sound").addEventListener("click", e => {
  soundEnabled = !soundEnabled;
  e.currentTarget.textContent = soundEnabled ? "SOUND ON" : "SOUND OFF";
  if (!soundEnabled) stopSpeech();
});

// ভয়েস রিকগনিশন (Microphone) সাপোর্ট
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Recognition) {
  recognition = new Recognition();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  
  recognition.onstart = () => {
    pendingStart = false;
    micUI(true);
    micHelp.textContent = "Listening for one phrase…";
  };
  
  recognition.onresult = e => {
    const phrase = e.results?.[e.resultIndex]?.[0]?.transcript?.trim();
    if (phrase && micOn && !busy) {
      micOn = false;
      micUI(false);
      micHelp.textContent = "Voice phrase received.";
      sendMessage(phrase);
    }
  };
  
  recognition.onerror = e => {
    pendingStart = false;
    micHelp.textContent = `Microphone issue: ${e.error}. Check browser permission.`;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      micOn = false;
      micUI(false);
    }
  };
  
  recognition.onend = () => {
    pendingStart = false;
    if (!micOn) {
      micUI(false);
      micHelp.textContent = "Voice input is off.";
    }
  };
  
  function beginListening() {
    if (!recognition || !micOn || busy || utterancePlaying || pendingStart) return;
    pendingStart = true;
    try { recognition.start(); } catch (_) { pendingStart = false; }
  }
  
  micBtn.addEventListener("click", () => {
    if (busy) return;
    if (micOn) {
      micOn = false;
      manualStop = true;
      stopListening();
      micUI(false);
      micHelp.textContent = "Voice input is off.";
    } else {
      micOn = true;
      manualStop = false;
      beginListening();
      micHelp.textContent = "Requesting microphone permission…";
    }
  });
} else {
  micBtn.disabled = true;
  micHelp.textContent = "Speech recognition is not supported in this browser.";
}

// হেলথ চেক ও ঘড়ি
fetch(HEALTH_ENDPOINT)
  .then(r => {
    if (!r.ok) throw Error("HTTP " + r.status);
    return r.json();
  })
  .then(data => {
    if (data?.status === "ok") setState("SERVER ONLINE", "var(--lime)");
    else setState("SERVER UNKNOWN", "var(--gold)");
  })
  .catch(() => setState("SERVER UNREACHABLE", "var(--red)"));

function updateClock() {
  document.getElementById("clock").textContent = new Date().toTimeString().split(" ")[0];
}
updateClock();
setInterval(updateClock, 1000);

log("SYSTEM", "Ready. Type a message and press SEND, or tap MIC for voice input.", "system");

// ۳D/2D Neural Canvas Rendering
const box = document.getElementById("brainbox");
const canvas = document.getElementById("brain");

function isWebGLSupported() {
  try {
    const c = document.createElement("canvas");
    return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));
  } catch (_) {
    return false;
  }
}

let targetColor = null;

if (typeof THREE !== "undefined" && isWebGLSupported()) {
  try {
    document.getElementById("webgl-status").textContent = "3D ACTIVE";
    document.getElementById("canvas-label").textContent = "NEURAL FIELD // LIVE VISUAL";
    
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 1000);
    camera.position.z = 17;
    
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(box.clientWidth, box.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    const count = 300;
    const coords = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      let a = Math.random() * Math.PI * 2;
      let b = Math.acos(2 * Math.random() - 1);
      let r = 4.5 + Math.random();
      coords[i * 3] = r * Math.sin(b) * Math.cos(a);
      coords[i * 3 + 1] = r * Math.sin(b) * Math.sin(a);
      coords[i * 3 + 2] = r * Math.cos(b);
    }
    
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(coords, 3));
    
    const dots = new THREE.Points(
      geo, 
      new THREE.PointsMaterial({ color: 0x5cf4e8, size: 0.12, transparent: true, opacity: 0.85 })
    );
    scene.add(dots);
    
    targetColor = new THREE.Color("#5cf4e8");
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.8, 1),
      new THREE.MeshBasicMaterial({ color: 0x5cf4e8, wireframe: true, transparent: true, opacity: 0.28 })
    );
    scene.add(core);
    
    function animate() {
      requestAnimationFrame(animate);
      dots.rotation.y += 0.002;
      core.rotation.y -= 0.004;
      core.material.color.lerp(targetColor, 0.04);
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener("resize", () => {
      camera.aspect = box.clientWidth / box.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(box.clientWidth, box.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  } catch (_) {
    draw2D();
  }
} else {
  draw2D();
}

function draw2D() {
  document.getElementById("webgl-status").textContent = "2D MODE";
  document.getElementById("canvas-label").textContent = "NEURAL FIELD // 2D VISUAL";
  
  const ctx = canvas.getContext("2d");
  let angle = 0;
  
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, box.clientWidth * dpr);
    canvas.height = Math.max(1, box.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  
  resize();
  window.addEventListener("resize", resize);
  
  function frame() {
    const w = box.clientWidth;
    const h = box.clientHeight;
    ctx.clearRect(0, 0, w, h);
    
    const x = w / 2;
    const y = h / 2;
    
    ctx.strokeStyle = "#5cf4e866";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 49 + Math.sin(angle) * 5, 0, Math.PI * 2);
    ctx.stroke();
    
    for (let i = 0; i < 8; i++) {
      const a = angle + (i * Math.PI) / 4;
      ctx.fillStyle = i % 2 ? "#a68bff" : "#5cf4e8";
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 65, y + Math.sin(a) * 65, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    
    angle += 0.018;
    requestAnimationFrame(frame);
  }
  frame();
}

// নোড ফিল্টার বাটনগুলোর ইন্টারেকশন
document.querySelectorAll(".node").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".node").forEach(n => n.classList.remove("active"));
    button.classList.add("active");
    
    if (targetColor) {
      targetColor.set(button.dataset.color || "#5cf4e8");
    }
    log("SYSTEM", `Focus set to ${button.dataset.name}.`, "system");
  });
});

})();
</script>
