<script>
"use strict";

// ============================================
// 1. ELEMENTS
// ============================================

const $ = (id) => document.getElementById(id);

const clock = $("clock");
const soundBtn = $("sound");
const statusEl = $("sys-status");
const latencyEl = $("lat");
const memEl = $("mem");

const viz = $("viz");
const terminal = $("terminal");
const userInput = $("userInput");
const sendBtn = $("sendBtn");
const clearBtn = $("clear");
const micBtn = $("micBtn");

const brainBox = $("brainbox");
const canvas = $("brain");

const webglStatus = $("webgl-status");
const canvasLabel = $("canvas-label");

const API_ENDPOINT =
    "https://my-personal-ai-ubh0.onrender.com/api/chat";

let soundEnabled = true;
let isBusy = false;
let recognition = null;
let listeningEnabled = false;
let isListening = false;
let isSpeaking = false;
let targetColor = null;
let threeRenderer = null;


// ============================================
// 2. CLOCK
// ============================================

function updateClock() {
    if (clock) {
        clock.textContent =
            new Date().toLocaleTimeString();
    }
}

updateClock();
setInterval(updateClock, 1000);


// ============================================
// 3. SAFE TERMINAL MESSAGES
// ============================================

function addMessage(who, text, type = "agent") {
    if (!terminal) return;

    const msg = document.createElement("div");
    msg.className = `msg ${type}`;

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = new Date().toLocaleTimeString();

    const label = document.createElement("span");
    label.className = "who";
    label.textContent = `[${who}]`;

    const content = document.createElement("span");
    content.textContent = String(text ?? "");

    msg.append(time, label, content);
    terminal.appendChild(msg);

    // Keep the terminal from growing indefinitely.
    while (terminal.children.length > 200) {
        terminal.removeChild(terminal.firstChild);
    }

    terminal.scrollTop = terminal.scrollHeight;
}


// ============================================
// 4. SOUND TOGGLE
// ============================================

if (soundBtn) {
    soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;

        soundBtn.textContent =
            soundEnabled ? "SOUND ON" : "SOUND OFF";

        if (!soundEnabled && "speechSynthesis" in window) {
            speechSynthesis.cancel();
            isSpeaking = false;
            if (viz) viz.classList.remove("playing");
            resumeListening();
        }
    });
}


// ============================================
// 5. CLEAR TERMINAL
// ============================================

if (clearBtn) {
    clearBtn.addEventListener("click", () => {
        terminal.replaceChildren();

        addMessage(
            "SYSTEM",
            "Terminal cleared.",
            "system"
        );
    });
}


// ============================================
// 6. BACKEND STATUS
// ============================================

// Do not claim the backend is online until a request succeeds.
if (statusEl) {
    statusEl.textContent = "BACKEND STATUS UNKNOWN";
    statusEl.classList.remove("live");
}

if (memEl) {
    memEl.textContent = "WAITING";
}


// ============================================
// 7. SPEECH OUTPUT
// ============================================

function speakText(text) {
    if (
        !soundEnabled ||
        !("speechSynthesis" in window) ||
        !text
    ) {
        resumeListening();
        return;
    }

    speechSynthesis.cancel();

    isSpeaking = true;

    if (recognition && isListening) {
        try {
            recognition.stop();
        } catch (error) {
            // Recognition may already be stopped.
        }
    }

    const utterance = new SpeechSynthesisUtterance(
        String(text)
    );

    // Change to "bn-BD" if your backend replies in Bengali.
    utterance.lang = "en-US";
    utterance.rate = 1;
    utterance.pitch = 1;

    if (viz) viz.classList.add("playing");

    utterance.onend = () => {
        isSpeaking = false;

        if (viz) viz.classList.remove("playing");

        resumeListening();
    };

    utterance.onerror = () => {
        isSpeaking = false;

        if (viz) viz.classList.remove("playing");

        resumeListening();
    };

    speechSynthesis.speak(utterance);
}


// ============================================
// 8. SEND MESSAGE TO BACKEND
// ============================================

async function handleSendMessage(customText = null) {
    const message = String(
        customText ?? userInput.value
    ).trim();

    if (!message || isBusy) return;

    isBusy = true;

    if (sendBtn) sendBtn.disabled = true;

    if (userInput) userInput.value = "";

    addMessage("YOU", message, "system");

    // Pause microphone while waiting for the reply.
    if (recognition && isListening) {
        try {
            recognition.stop();
        } catch (error) {
            // Safe to ignore if already stopped.
        }
    }

    const startedAt = performance.now();

    try {
        addMessage(
            "SYSTEM",
            "Connecting to the AI backend...",
            "system"
        );

        const controller = new AbortController();

        const timeout = setTimeout(
            () => controller.abort(),
            45000
        );

        let response;

        try {
            response = await fetch(API_ENDPOINT, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    prompt: message
                }),
                signal: controller.signal
            });
        } finally {
            clearTimeout(timeout);
        }

        if (latencyEl) {
            latencyEl.textContent = Math.round(
                performance.now() - startedAt
            );
        }

        if (!response.ok) {
            let detail = "";

            try {
                detail = await response.text();
            } catch (error) {
                // Error response body may be unavailable.
            }

            if (response.status === 502) {
                throw new Error(
                    "502 Bad Gateway: Check whether the Render " +
                    "backend is running correctly."
                );
            }

            if (response.status === 404) {
                throw new Error(
                    "404 Not Found: Check the /api/chat route."
                );
            }

            if (response.status === 429) {
                throw new Error(
                    "429 Too Many Requests: Try again later."
                );
            }

            throw new Error(
                `HTTP ${response.status}` +
                (detail ? `: ${detail.slice(0, 250)}` : "")
            );
        }

        const data = await response.json();

        const reply =
            data.reply ??
            data.response ??
            data.output ??
            data.message;

        if (typeof reply !== "string" || !reply.trim()) {
            throw new Error(
                "The server returned no usable text reply. " +
                "Check the backend JSON response format."
            );
        }

        if (statusEl) {
            statusEl.textContent = "BACKEND RESPONDING";
            statusEl.classList.add("live");
        }

        if (memEl) {
            memEl.textContent = "CONNECTED";
        }

        addMessage("AI", reply, "agent");

        // Speak only after the request has completed.
        speakText(reply);

    } catch (error) {
        let errorMessage = error.message;

        if (error.name === "AbortError") {
            errorMessage =
                "Request timed out after 45 seconds. " +
                "Check the Render server.";
        } else if (
            error instanceof TypeError
        ) {
            errorMessage =
                "Network or CORS error. Check the API URL, " +
                "Render server, and CORS configuration.";
        }

        if (statusEl) {
            statusEl.textContent = "BACKEND ERROR";
            statusEl.classList.remove("live");
        }

        if (memEl) {
            memEl.textContent = "ERROR";
        }

        addMessage(
            "ERROR",
            errorMessage,
            "error"
        );

    } finally {
        isBusy = false;

        if (sendBtn) sendBtn.disabled = false;

        if (!isSpeaking) {
            resumeListening();
        }
    }
}


// ============================================
// 9. CHAT BUTTON AND ENTER KEY
// ============================================

if (sendBtn) {
    sendBtn.addEventListener("click", () => {
        handleSendMessage();
    });
}

if (userInput) {
    userInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            handleSendMessage();
        }
    });
}


// ============================================
// 10. SPEECH RECOGNITION
// ============================================

const SpeechRecognitionAPI =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

function setMicState(active, label) {
    if (!micBtn) return;

    micBtn.classList.toggle("active", active);
    micBtn.textContent = label;
}

function resumeListening() {
    if (
        !recognition ||
        !listeningEnabled ||
        isBusy ||
        isSpeaking ||
        isListening
    ) {
        return;
    }

    try {
        recognition.start();
    } catch (error) {
        // The browser may still be transitioning states.
    }
}

if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();

    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onstart = () => {
        isListening = true;
        setMicState(true, "MIC ON");
    };

    recognition.onresult = (event) => {
        const result =
            event.results[event.results.length - 1];

        if (!result || !result.isFinal) return;

        const transcript =
            result[0].transcript.trim();

        if (transcript && !isBusy && !isSpeaking) {
            handleSendMessage(transcript);
        }
    };

    recognition.onerror = (event) => {
        if (event.error === "not-allowed") {
            listeningEnabled = false;

            addMessage(
                "MIC",
                "Microphone permission denied. " +
                "Allow microphone access in your browser.",
                "error"
            );
        } else if (event.error === "no-speech") {
            // No speech detected; the listener can restart.
        } else if (event.error !== "aborted") {
            addMessage(
                "MIC",
                `Speech recognition error: ${event.error}`,
                "error"
            );
        }
    };

    recognition.onend = () => {
        isListening = false;

        if (!listeningEnabled) {
            setMicState(false, "MIC OFF");
            return;
        }

        setMicState(false, "MIC READY");

        if (!isBusy && !isSpeaking) {
            setTimeout(resumeListening, 500);
        }
    };

    if (micBtn) {
        // Microphone starts OFF. The user must enable it.
        setMicState(false, "MIC OFF");

        micBtn.addEventListener("click", () => {
            if (listeningEnabled) {
                listeningEnabled = false;

                try {
                    recognition.stop();
                } catch (error) {
                    // Already stopped.
                }

                setMicState(false, "MIC OFF");

            } else {
                listeningEnabled = true;
                resumeListening();
            }
        });
    }

} else {
    setMicState(false, "MIC UNSUPPORTED");

    if (micBtn) {
        micBtn.disabled = true;
        micBtn.title =
            "Speech recognition is not supported by this browser.";
    }

    addMessage(
        "SYSTEM",
        "Speech recognition is unavailable in this browser. " +
        "You can still use text chat.",
        "system"
    );
}


// ============================================
// 11. THREE.JS / 2D FALLBACK
// ============================================

function isWebGLSupported() {
    try {
        const testCanvas = document.createElement("canvas");

        return Boolean(
            window.WebGLRenderingContext &&
            (
                testCanvas.getContext("webgl") ||
                testCanvas.getContext("experimental-webgl")
            )
        );
    } catch (error) {
        return false;
    }
}

const hasThree = typeof THREE !== "undefined";
const hasWebGL = isWebGLSupported();

if (hasThree && hasWebGL && brainBox && canvas) {
    try {
        webglStatus.textContent = "3D ACTIVE";
        canvasLabel.textContent = "NEURAL FIELD // LIVE 3D RENDER";

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            45,
            brainBox.clientWidth / brainBox.clientHeight,
            0.1,
            1000
        );

        camera.position.z = 18;

        threeRenderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });

        threeRenderer.setPixelRatio(
            Math.min(window.devicePixelRatio || 1, 2)
        );

        const particlesCount = 350;
        const geometry = new THREE.BufferGeometry();

        const positions = new Float32Array(
            particlesCount * 3
        );

        const colors = new Float32Array(
            particlesCount * 3
        );

        for (let i = 0; i < particlesCount; i++) {
            const u = Math.random();
            const v = Math.random();

            const theta = u * Math.PI * 2;
            const phi = Math.acos(2 * v - 1);
            const r = 5.5 + (Math.random() - 0.5) * 0.8;

            positions[i * 3] =
                r * Math.sin(phi) * Math.cos(theta);

            positions[i * 3 + 1] =
                r * Math.sin(phi) * Math.sin(theta);

            positions[i * 3 + 2] =
                r * Math.cos(phi);

            colors[i * 3] = 0.36;
            colors[i * 3 + 1] = 0.95;
            colors[i * 3 + 2] = 0.91;
        }

        geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3)
        );

        geometry.setAttribute(
            "color",
            new THREE.BufferAttribute(colors, 3)
        );

        const material = new THREE.PointsMaterial({
            size: 0.25,
            vertexColors: true,
            transparent: true,
            opacity: 0.85
        });

        const particleSystem = new THREE.Points(
            geometry,
            material
        );

        scene.add(particleSystem);

        const coreGeometry =
            new THREE.IcosahedronGeometry(3.5, 2);

        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x5cf4e8,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });

        const coreMesh = new THREE.Mesh(
            coreGeometry,
            coreMaterial
        );

        scene.add(coreMesh);

        let mouseX = 0;
        let mouseY = 0;
        let animationFrame = 0;

        brainBox.addEventListener("mousemove", (event) => {
            const rect = brainBox.getBoundingClientRect();

            mouseX =
                ((event.clientX - rect.left) /
                rect.width - 0.5) * 2;

            mouseY =
                -((event.clientY - rect.top) /
                rect.height - 0.5) * 2;
        });

        function resize3D() {
            const width = brainBox.clientWidth;
            const height = brainBox.clientHeight;

            if (!width || !height) return;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            threeRenderer.setSize(width, height, false);
        }

        function animate3D() {
            animationFrame = requestAnimationFrame(animate3D);

            particleSystem.rotation.y +=
                0.003 + mouseX * 0.008;

            particleSystem.rotation.x +=
                0.001 - mouseY * 0.008;

            coreMesh.rotation.y -= 0.005;

            if (targetColor) {
                coreMesh.material.color.lerp(
                    targetColor,
                    0.05
                );
            }

            threeRenderer.render(scene, camera);
        }

        window.addEventListener("resize", resize3D);

        resize3D();
        animate3D();

    } catch (error) {
        console.error("3D initialization failed:", error);

        webglStatus.textContent = "2D MODE";
        canvasLabel.textContent = "NEURAL FIELD // 2D FALLBACK";
    }

} else {
    webglStatus.textContent = "2D MODE";
    canvasLabel.textContent = "NEURAL FIELD // 2D FALLBACK";

    const ctx = canvas.getContext("2d");

    let angle = 0;

    function resize2D() {
        const rect = brainBox.getBoundingClientRect();

        canvas.width = Math.max(1, Math.floor(rect.width));
        canvas.height = Math.max(1, Math.floor(rect.height));
    }

    function draw2D() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        ctx.strokeStyle = "#5cf4e844";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            50 + Math.sin(angle) * 4,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        angle += 0.03;

        requestAnimationFrame(draw2D);
    }

    window.addEventListener("resize", resize2D);

    resize2D();
    draw2D();
}


// ============================================
// 12. NEURAL NODE SWITCHING
// ============================================

document.querySelectorAll(".node").forEach((button) => {
    button.addEventListener("click", function () {
        document.querySelectorAll(".node").forEach((node) => {
            node.classList.remove("active");
        });

        this.classList.add("active");

        const hex = this.dataset.color || "#5cf4e8";

        if (hasThree && hasWebGL && targetColor) {
            targetColor.set(hex);
        }

        addMessage(
            "SYSTEM",
            `Core focus shifted to ${this.dataset.name}.`,
            "system"
        );
    });
});


// ============================================
// 13. STARTUP MESSAGE
// ============================================

addMessage(
    "SYSTEM",
    "Dashboard initialized. Type a message or enable the microphone.",
    "system"
);

</script>
