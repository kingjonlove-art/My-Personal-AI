<script>
function startChat() {
    document.getElementById("landing-screen").style.display = "none";
    document.getElementById("chat-container").style.display = "flex";
    document.getElementById("message-input").focus();
}

const form = document.getElementById("chat-form");
const input = document.getElementById("message-input");
const chatBox = document.getElementById("chat-box");
const sendBtn = document.getElementById("send-btn");

const conversation = [];

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
    return message;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = input.value.trim();

    if (!message || sendBtn.disabled) {
        return;
    }

    addMessage(message, "user-message");

    conversation.push({
        role: "user",
        content: message
    });

    input.value = "";
    sendBtn.disabled = true;

    const loading = addMessage("AI উত্তর তৈরি করছে...", "ai-message");

    try {
        const response = await fetch("https://my-personal-ai-ubh0.onrender.com/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ messages: conversation })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI সার্ভারে সমস্যা হয়েছে।");
        }

        loading.textContent = data.reply;

        conversation.push({
            role: "assistant",
            content: data.reply
        });

    } catch (error) {
        loading.textContent = "দুঃখিত! " + error.message + " সার্ভার চালু আছে কি না পরীক্ষা করুন।";
        conversation.pop(); // Remove the last user message to try again
    } finally {
        sendBtn.disabled = false;
        input.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
    }
});
</script>
