<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #334155;
        }
        header {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .ai-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #8b5cf6;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .header-info h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }
        .header-info p {
            font-size: 0.85rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }
        .loading-message {
            align-self: flex-start;
            background: #334155;
            color: #94a3b8;
            border-bottom-left-radius: 2px;
            font-style: italic;
        }
        .error-message {
            align-self: flex-start;
            background: #fecaca;
            color: #b91c1c;
            border-bottom-left-radius: 2px;
        }
        .input-form {
            padding: 16px 20px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }
        .message-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px 16px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .message-input:focus {
            border-color: #3b82f6;
        }
        .send-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            color: #ffffff;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="ai-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="header-info">
                <h1>My Personal AI</h1>
                <p><span class="status-dot"></span> অনলাইন আছেন</p>
            </div>
        </header>
        <div id="chat-container">
            <div id="chat-box">
                <div class="message ai-message">হ্যালো! আমি আপনার পার্সোনাল এআই। আমি আপনাকে কীভাবে সাহায্য করতে পারি?</div>
            </div>
        </div>
        <form class="input-form" id="chat-form">
            <input type="text" class="message-input" id="message-input" placeholder="আপনার বার্তা লিখুন..." autocomplete="off" required>
            <button type="submit" class="send-btn" id="send-btn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatBox = document.getElementById('chat-box');
        const sendBtn = document.getElementById('send-btn');

        let conversation = [];

        function addMessage(text, type) {
            const message = document.createElement('div');
            message.classList.add('message');
            message.classList.add(`${type}-message`);
            message.textContent = text;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
            return message;
        }

        chatForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const message = messageInput.value.trim();
            if (message === '' || sendBtn.disabled) return;

            addMessage(message, 'user');
            conversation.push({ role: 'user', content: message });

            messageInput.value = '';
            sendBtn.disabled = true;

            const loadingMessage = addMessage('AI উত্তর তৈরি করছে...', 'loading-message');

            try {
                const response = await fetch('https://my-personal-ai-1-lz9o.onrender.com/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: conversation })
                });

                chatBox.removeChild(loadingMessage);

                if (!response.ok) {
                    throw new Error('AI থেকে কোনো উত্তর পাওয়া যায়নি');
                }

                const data = await response.json();

                addMessage(data.reply, 'ai-message');
                conversation.push({ role: 'assistant', content: data.reply });

            } catch (error) {
                chatBox.removeChild(loadingMessage);
                addMessage('ত্রুটি: ' + error.message, 'error-message');
                conversation.pop();
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
