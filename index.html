<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0a0a0c;color:#fff;font-family:Arial,sans-serif}
.container{max-width:800px;margin:auto}
h1{color:#8b80ff;text-align:center}
p{color:#bbb;text-align:center}
textarea{width:100%;height:130px;padding:15px;background:#16161a;color:white;border:1px solid #444;border-radius:10px;font-size:16px}
button{padding:13px 18px;margin-top:12px;background:#7565ff;color:white;border:0;border-radius:8px;font-size:16px;cursor:pointer}
#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#16161a;padding:15px;border-radius:10px;min-height:100px;margin-top:18px}
#copy{background:#248b64}
</style>
</head>
<body>
<div class="container">
<h1>My Personal AI</h1>
<p>Describe a program. AI will write the code for you.</p>

<textarea id="task" placeholder="Example: Create a calculator using HTML, CSS and JavaScript"></textarea>

<button id="generate" onclick="generateCode()">Generate Code</button>
<button id="copy" onclick="copyCode()">Copy Code</button>

<div id="result">Your generated code will appear here.</div>
</div>

<script>
async function generateCode(){
  const task=document.getElementById("task").value.trim();
  const result=document.getElementById("result");
  const button=document.getElementById("generate");

  if(!task){
    result.textContent="Please describe the program you want.";
    return;
  }

  button.disabled=true;
  result.textContent="AI is writing your code...";

  try{
    const response=await fetch("/generate-code",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({task:task})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "Request failed");
    }

    result.textContent=data.code || data.error || "No code returned.";
  }catch(error){
    result.textContent="Error: "+error.message+
      "\nCheck your server and API key.";
  }finally{
    button.disabled=false;
  }
}

function copyCode(){
  const text=document.getElementById("result").textContent;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(()=>alert("Code copied!"))
      .catch(()=>alert("Please select and copy the code manually."));
  }else{
    alert("Please select and copy the code manually.");
  }
}
</script>
</body>
</html>
